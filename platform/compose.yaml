services:
  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: scheduly_local
      POSTGRES_USER: scheduly
      POSTGRES_PASSWORD: local-rehearsal-only
    ports:
      - "127.0.0.1:55439:5432"
    volumes:
      - scheduly-local-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scheduly -d scheduly_local"]
      interval: 2s
      retries: 20
volumes:
  scheduly-local-data:
